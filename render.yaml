services:
  - type: web
    name: elden-ring-hub-api
    env: node
    plan: free
    rootDir: api
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elden-ring-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: elden-ring-hub-db
    plan: free