# Render Infrastructure Configuration
services:
  - type: web
    name: elden-ring-hub-api
    env: node
    plan: free
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elden-ring-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: elden-ring-hub-db
    plan: free